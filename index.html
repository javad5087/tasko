<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#F2F2F7" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="کارهای من" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>کارهای من</title>

  <!-- فونت وزیرمتن -->
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />

  <style>
    :root {
      --bg: #F2F2F7;
      --card: #FFFFFF;
      --text: #1C1C1E;
      --muted: #8E8E93;
      --orange: #FF6B00;
      --gray-section: #E8E8ED;
      --shadow: 0 8px 24px rgba(0,0,0,0.06);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: Vazirmatn, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding: 8px 16px 30px;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 15px;
      font-weight: 600;
      padding: 6px 4px 14px;
      color: var(--text);
    }

    .day-card {
      background: var(--card);
      border-radius: 24px;
      box-shadow: var(--shadow);
      padding: 26px 20px 18px;
      margin-bottom: 14px;
    }

    .day-title {
      font-size: 27px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin-bottom: 3px;
    }

    .day-date {
      font-size: 13.5px;
      color: var(--muted);
      margin-bottom: 20px;
    }

    .task-list {
      list-style: none;
      margin-bottom: 12px;
    }

    .task-item {
      display: flex;
      align-items: center;
      gap: 13px;
      padding: 10px 0;
      cursor: pointer;
      user-select: none;
    }

    .checkbox {
      width: 24px;
      height: 24px;
      border-radius: 6px;
      border: 1.8px solid #C7C7CC;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.15s ease;
      background: transparent;
    }

    .task-item.done .checkbox {
      background: var(--orange);
      border-color: var(--orange);
    }

    .checkbox svg {
      width: 13px;
      height: 13px;
      opacity: 0;
      transition: opacity 0.12s;
    }

    .task-item.done .checkbox svg {
      opacity: 1;
    }

    .task-text {
      font-size: 16px;
      font-weight: 500;
      line-height: 1.4;
      flex: 1;
    }

    .task-item.done .task-text {
      color: var(--muted);
      text-decoration: line-through;
      text-decoration-color: #C7C7CC;
    }

    .add-task {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-top: 10px;
      border-top: 1px solid #F0F0F5;
      margin-top: 4px;
    }

    .add-task input {
      flex: 1;
      border: none;
      outline: none;
      font-family: inherit;
      font-size: 15.5px;
      color: var(--text);
      background: transparent;
      padding: 10px 0;
      -webkit-appearance: none;
    }

    .add-task input::placeholder {
      color: #C7C7CC;
    }

    .add-btn {
      background: var(--orange);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 8px 14px;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .add-btn:active {
      opacity: 0.85;
    }

    .other-days {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .day-section {
      background: var(--gray-section);
      border-radius: 16px;
      padding: 17px;
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }

    .ios-guide {
      margin-top: 20px;
      background: #FFF8F0;
      border: 1px solid #FFE0C2;
      border-radius: 16px;
      padding: 16px;
      font-size: 13.5px;
      line-height: 1.7;
      color: #5C3A1A;
    }

    .ios-guide strong {
      color: #FF6B00;
    }

    .ios-guide ol {
      padding-right: 18px;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <div class="status-bar">
    <span id="current-time">۹:۴۱</span>
    <span style="font-size:13px;">📶 🔋</span>
  </div>

  <div class="day-card">
    <div class="day-title" id="day-name">دوشنبه</div>
    <div class="day-date" id="day-date">۱۹ آبان ۱۴۰۵</div>

    <ul class="task-list" id="task-list"></ul>

    <div class="add-task">
      <input type="text" id="new-task-input" placeholder="افزودن کار جدید..." maxlength="80" enterkeyhint="done" />
      <button class="add-btn" id="add-btn">افزودن</button>
    </div>
  </div>

  <div class="other-days" id="other-days"></div>

  <div class="ios-guide" id="ios-guide">
    <strong>📲 نصب روی آیفون:</strong>
    <ol>
      <li>دکمه <strong>Share</strong> (مربع با فلش بالا) پایین صفحه رو بزن</li>
      <li>گزینه <strong>Add to Home Screen</strong> رو انتخاب کن</li>
      <li>اسمش رو تأیید کن و Add بزن</li>
    </ol>
    بعد از نصب مثل یه اپ واقعی باز می‌شه.
  </div>

<script>
function gregorianToJalali(gy, gm, gd) {
  const g_d_m = [0, 31, 59, 90, 120, 151, 181, 212, 243, 273, 304, 334];
  let jy = (gy <= 1600) ? 0 : 979;
  gy -= (gy <= 1600) ? 621 : 1600;
  let gy2 = (gm > 2) ? (gy + 1) : gy;
  let days = (365 * gy) + Math.floor((gy2 + 3) / 4) - Math.floor((gy2 + 99) / 100) +
             Math.floor((gy2 + 399) / 400) - 80 + gd + g_d_m[gm - 1];
  jy += 33 * Math.floor(days / 12053);
  days %= 12053;
  jy += 4 * Math.floor(days / 1461);
  days %= 1461;
  if (days > 365) {
    jy += Math.floor((days - 1) / 365);
    days = (days - 1) % 365;
  }
  const jm = (days < 186) ? 1 + Math.floor(days / 31) : 7 + Math.floor((days - 186) / 30);
  const jd = 1 + ((days < 186) ? (days % 31) : ((days - 186) % 30));
  return { jy, jm, jd };
}

const persianMonths = ['', 'فروردین', 'اردیبهشت', 'خرداد', 'تیر', 'مرداد', 'شهریور', 'مهر', 'آبان', 'آذر', 'دی', 'بهمن', 'اسفند'];
const persianWeekDays = ['یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنج‌شنبه', 'جمعه', 'شنبه'];

function toPersianNumber(n) {
  const p = '۰۱۲۳۴۵۶۷۸۹';
  return String(n).replace(/\d/g, d => p[d]);
}

let tasks = JSON.parse(localStorage.getItem('todo-tasks-v2') || 'null') || [
  { id: 1, title: '۵ کیلومتر دویدن', done: true },
  { id: 2, title: 'خواندن ۱۰ صفحه کتاب', done: false },
  { id: 3, title: 'پیاده‌روی با سگ', done: false },
  { id: 4, title: 'خرید مواد غذایی', done: false },
  { id: 5, title: 'طراحی اپ لیست کارها', done: false }
];

function render() {
  const list = document.getElementById('task-list');
  list.innerHTML = '';

  tasks.forEach(task => {
    const li = document.createElement('li');
    li.className = 'task-item' + (task.done ? ' done' : '');
    li.innerHTML = `
      <div class="checkbox">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="20 6 9 17 4 12"></polyline>
        </svg>
      </div>
      <span class="task-text">${task.title}</span>
    `;
    li.onclick = () => {
      task.done = !task.done;
      save();
      render();
    };
    list.appendChild(li);
  });
}

function save() {
  localStorage.setItem('todo-tasks-v2', JSON.stringify(tasks));
}

function addTask() {
  const input = document.getElementById('new-task-input');
  const title = input.value.trim();
  if (!title) return;
  tasks.push({ id: Date.now(), title, done: false });
  input.value = '';
  save();
  render();
  input.blur();
}

function updateDateTime() {
  const now = new Date();
  const { jy, jm, jd } = gregorianToJalali(now.getFullYear(), now.getMonth() + 1, now.getDate());

  document.getElementById('day-name').textContent = persianWeekDays[now.getDay()];
  document.getElementById('day-date').textContent = `${toPersianNumber(jd)} ${persianMonths[jm]} ${toPersianNumber(jy)}`;

  let h = now.getHours();
  let m = now.getMinutes().toString().padStart(2, '0');
  document.getElementById('current-time').textContent = toPersianNumber(h + ':' + m);
}

function renderOtherDays() {
  const container = document.getElementById('other-days');
  const todayIndex = new Date().getDay();
  const days = ['یکشنبه', 'دوشنبه', 'سه‌شنبه', 'چهارشنبه', 'پنج‌شنبه', 'جمعه', 'شنبه'];
  let html = '';
  for (let i = 1; i <= 4; i++) {
    const idx = (todayIndex + i) % 7;
    html += `<div class="day-section">${days[idx]}</div>`;
  }
  container.innerHTML = html;
}

document.getElementById('add-btn').onclick = addTask;
document.getElementById('new-task-input').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') {
    e.preventDefault();
    addTask();
  }
});

updateDateTime();
renderOtherDays();
render();
setInterval(updateDateTime, 20000);

if (window.navigator.standalone === true) {
  document.getElementById('ios-guide').style.display = 'none';
}
</script>
</body>
</html>
